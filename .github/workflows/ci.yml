name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm test
      - run: npm run check
      - run: npm run smoke:plugin
      - run: npm run smoke:mcp
      - run: python "$HOME/.codex/skills/.system/plugin-creator/scripts/validate_plugin.py" .
        if: ${{ false }}
      - run: python scripts/validate-plugin-ci.py
